<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#174b42">
  <title>Guest guide</title>
  <link rel="icon" href="data:,">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap');
    :root{--ink:#17352f;--forest:#174b42;--paper:#f8f5ed;--warm:#eee6d6;--line:#d9d3c6;--sun:#e8a93b;--alert:#fff2d8;--muted:#5e716a;--white:#fffdf8;--radius:20px}
    *{box-sizing:border-box} html{background:var(--paper);scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.54 "DM Sans",Arial,sans-serif;text-rendering:optimizeLegibility}.shell{max-width:760px;margin:auto;min-height:100vh}.top{background:var(--forest);color:white;padding:18px 20px 30px;position:relative;overflow:hidden}.top:after{content:"";width:220px;height:220px;border:1px solid rgba(255,255,255,.16);border-radius:50%;position:absolute;right:-100px;top:-100px}.language{position:relative;z-index:1;display:flex;justify-content:flex-end;gap:6px}.language button{font:600 12px "DM Mono",monospace;letter-spacing:.08em;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:transparent;color:white;padding:9px 12px;min-height:40px;cursor:pointer}.language button.active{background:#fff;color:var(--forest);border-color:#fff}.eyebrow{font:500 11px "DM Mono",monospace;letter-spacing:.14em;opacity:.76;margin:28px 0 8px}.title{font:600 clamp(34px,9vw,55px)/.98 Newsreader,Georgia,serif;letter-spacing:-.035em;margin:0;max-width:530px}.address{font-size:15px;margin:13px 0 0;opacity:.9}.content{padding:22px 16px 48px}.intro{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(21,51,43,.06)}.intro strong{display:block;font-size:17px;margin-bottom:5px}.intro p{margin:0;color:var(--muted)}.step{padding:30px 4px 0}.step-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:16px}.num{font:500 12px "DM Mono",monospace;color:var(--forest);background:#dfece7;border-radius:999px;padding:5px 8px}.step h2{font:600 27px/1.08 Newsreader,Georgia,serif;letter-spacing:-.025em;margin:0}.place{font-weight:700;margin:0 0 5px}.step p{margin:10px 0}.action{display:flex;align-items:center;justify-content:space-between;gap:10px;color:white;background:var(--forest);padding:13px 15px;border-radius:13px;text-decoration:none;font-weight:700;min-height:48px;margin:13px 0}.action:after{content:"↗";font:20px "DM Mono",monospace}.note{border-radius:14px;background:var(--alert);padding:14px 15px;margin:16px 0;color:#684b11}.note strong{color:#4e3609}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 5px}.photo{margin:0}.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--warm);border:1px solid var(--line)}.photo:first-child img{object-position:center}.photo:last-child img{object-fit:cover}.photo figcaption{font-size:11px;line-height:1.25;color:var(--muted);padding:7px 2px}.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.contact a{color:var(--ink);text-decoration:none;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:76px;font-weight:700}.contact small{display:block;font:11px "DM Mono",monospace;color:var(--muted);margin-bottom:5px}.checkout{background:#dfece7;border-radius:var(--radius);padding:18px;margin-top:30px}.checkout h2{font:600 27px/1.08 Newsreader,Georgia,serif;margin:0 0 10px}.checkout p{margin:0}.reveal{margin:30px 0 0;border:1px solid var(--forest);background:var(--forest);border-radius:var(--radius);color:white;padding:20px}.reveal h2{font:600 28px/1.08 Newsreader,Georgia,serif;margin:0 0 8px}.reveal p{margin:0 0 15px;color:#e4f0eb}.code{display:flex;align-items:center;justify-content:space-between;background:white;color:var(--forest);border-radius:13px;padding:13px 15px;font:500 25px "DM Mono",monospace;letter-spacing:.12em}.footer{text-align:center;color:var(--muted);font-size:13px;margin:27px 0 0}.failure{max-width:560px;margin:12vh auto;padding:28px;background:var(--white);border:1px solid var(--line);border-radius:20px;text-align:center}.failure h1{font:600 35px Newsreader,Georgia,serif;margin:0 0 10px}.failure p{color:var(--muted)}
    @media(min-width:640px){.top{padding:22px 38px 42px}.content{padding:28px 38px 60px}.photos{gap:14px}.photo img{aspect-ratio:1/1.25}.step{padding-top:38px}.intro{padding:22px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body><main id="app" class="shell" aria-live="polite"></main>
<script src="vault.js"></script>
<script>
(() => {
  const app=document.querySelector('#app');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const b64uToBytes=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  async function unlock(){const fragment=new URLSearchParams(location.hash.slice(1));const key=fragment.get('k');if(!key)throw Error('no key');const raw=await crypto.subtle.importKey('raw',b64uToBytes(key),'PBKDF2',false,['deriveKey']);const derived=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64uToBytes(VAULT.salt),iterations:200000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64uToBytes(VAULT.iv)},derived,b64uToBytes(VAULT.data));return JSON.parse(new TextDecoder().decode(clear))}
  const render=(d,lang)=>{const t=d[lang], other=lang==='de'?'en':'de';document.documentElement.lang=lang;document.title=t.title;app.innerHTML=`<header class="top"><nav class="language" aria-label="Language"><button class="${lang==='de'?'active':''}" data-lang="de">DE</button><button class="${lang==='en'?'active':''}" data-lang="en">EN</button></nav><p class="eyebrow">${esc(t.eyebrow)}</p><h1 class="title">${esc(t.title)}</h1><p class="address">${esc(t.address)}</p></header><div class="content"><section class="intro"><strong>${esc(t.introTitle)}</strong><p>${esc(t.intro)}</p></section><section class="step"><div class="step-head"><span class="num">01</span><h2>${esc(t.collectTitle)}</h2></div><p class="place">${esc(d.place.name)}<br>${esc(d.place.address)}</p><a class="action" target="_blank" rel="noopener noreferrer" href="${esc(d.links.pickup)}">${esc(t.pickupMap)}</a><p>${esc(t.collectText)}</p><p>${esc(t.selfService)}</p></section><section class="step"><div class="step-head"><span class="num">02</span><h2>${esc(t.arriveTitle)}</h2></div><p>${esc(t.walkText)}</p><a class="action" target="_blank" rel="noopener noreferrer" href="${esc(d.links.walk)}">${esc(t.walkMap)}</a><p>${esc(t.keysText)}</p><div class="photos"><figure class="photo"><img src="assets/lockbox.jpg" alt="${esc(t.photos.lockbox)}"><figcaption>${esc(t.photos.lockbox)}</figcaption></figure><figure class="photo"><img src="assets/keys.jpg" alt="${esc(t.photos.keys)}"><figcaption>${esc(t.photos.keys)}</figcaption></figure><figure class="photo"><img src="assets/doormat.jpg" alt="${esc(t.photos.doormat)}"><figcaption>${esc(t.photos.doormat)}</figcaption></figure></div></section><section class="step"><div class="step-head"><span class="num">03</span><h2>${esc(t.stayTitle)}</h2></div><p><strong>${esc(t.wifiLabel)}</strong> ${esc(d.wifi.network)}<br><strong>${esc(t.passwordLabel)}</strong> <span style="font-family:'DM Mono',monospace">${esc(d.wifi.password)}</span><br><span style="color:var(--muted)">${esc(t.router)}</span></p><div class="contact"><a href="tel:${esc(d.contact.tel)}"><small>${esc(t.call)}</small>${esc(d.contact.display)}</a><a target="_blank" rel="noopener noreferrer" href="${esc(d.contact.whatsapp)}"><small>${esc(t.whatsapp)}</small>${esc(d.contact.name)}</a></div><div class="note"><strong>${esc(t.important)}</strong> ${esc(t.shower)}</div></section><section class="checkout"><h2>${esc(t.checkoutTitle)}</h2><p>${esc(t.checkout)}</p></section><section class="reveal" aria-label="${esc(t.codeTitle)}"><h2>${esc(t.codeTitle)}</h2><p>${esc(t.codeText)}</p><div class="code" aria-label="${esc(t.codeTitle)}"><span>${esc(d.lockboxCode)}</span><span aria-hidden="true">⌁</span></div></section><p class="footer">${esc(t.footer)}</p></div>`;app.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('alfred-lang',b.dataset.lang);render(d,b.dataset.lang)}));};
  unlock().then(d=>render(d,localStorage.getItem('alfred-lang')==='en'?'en':'de')).catch(()=>{app.innerHTML='<section class="failure"><h1>Link not available</h1><p>Bitte verwenden Sie den vollständigen Gäste-Link / Please use the complete guest link.</p></section>';});
})();
</script></body></html>
